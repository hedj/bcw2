# doc.verified

[[case]]
name = "a REQUIREMENT that no check verifies is a finding on its directive line"
findings = [
    {check = "verified", anchor = "core.rotation", at = ".. requirement:: core.rotation"},
]

[[case.replace]]
old = '''
.. check:: equiv
   :verifies: core.rotation
   :module: core_rotate
'''
new = ""

[[case]]
name = "verify none passes"
findings = []

[[case.replace]]
old = '''
.. check:: equiv
   :verifies: core.rotation
   :module: core_rotate
'''
new = ""

[[case.replace]]
old = "   :parent: core.timing\n\n   The core shall"
new = "   :parent: core.timing\n   :verify: none\n\n   The core shall"

[[case]]
name = "an implements comment in a tool verifies it"
tools = {"tool.py" = "# implements: core.rotation\n"}
findings = []

[[case.replace]]
old = '''
.. check:: equiv
   :verifies: core.rotation
   :module: core_rotate
'''
new = ""
