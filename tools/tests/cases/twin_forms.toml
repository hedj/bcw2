# doc.twin-forms and doc.twin-language: each form outside the twin language is a finding on its line.

[[case]]
name = "a condition with == passes"
findings = []

[[case.replace]]
old = "          return {'next': (turn + 1) % 8}\n"
new = "          return {'next': 0 if turn == 7 else turn + 1}\n"

[[case]]
name = "helpers, local names, bit operations, min, max, abs, chains and not pass"
findings = []

[[case.replace]]
old = '''
      def core_rotate(turn):
          return {'next': (turn + 1) % 8}
'''
new = '''
      def wrap(value):
          return value % 8


      def core_rotate(turn):
          after = wrap(turn + 1)
          low = min(after, max(turn, abs(turn - 9)))
          return {'next': (after & 7) | (turn ^ turn) | (0 if not 0 <= low < 99 else low >> 9) | (~turn & 0)}
'''

