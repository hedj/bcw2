# doc.source-targets, doc.fragment-uses, doc.fragments-used and doc.fragment-cycles

[[case]]
name = "a skeleton and its fragment pass"
append = '''

.. source:: build/rtl/core/pair.v

   module pair (input wire a, output wire b);
       <<:core.pair-logic>>
   endmodule

.. source:: :core.pair-logic

   assign b = a;
'''
findings = []

[[case]]
name = "a fragment can come before its use"
append = '''

.. source:: :core.pair-logic

   assign b = a;

.. source:: build/rtl/core/pair.v

   module pair (input wire a, output wire b);
       <<:core.pair-logic>>
   endmodule
'''
findings = []

[[case]]
name = "a use of no fragment is a finding on its line"
append = '''

.. source:: build/rtl/core/pair.v

   module pair (input wire a, output wire b);
       <<:core.pair-logic>>
   endmodule
'''
findings = [
    {check = "fragment-uses", at = "<<:core.pair-logic>>"},
]

[[case]]
name = "a fragment that reaches no file is a finding on its directive line"
append = '''

.. source:: :core.pair-logic

   assign b = a;
'''
findings = [
    {check = "fragments-used", at = ".. source:: :core.pair-logic"},
]

[[case]]
name = "a fragment that only a fragment that reaches no file uses reaches no file"
append = '''

.. source:: :core.outer

   <<:core.pair-logic>>

.. source:: :core.pair-logic

   assign b = a;
'''
findings = [
    {check = "fragments-used", at = ".. source:: :core.outer"},
    {check = "fragments-used", at = ".. source:: :core.pair-logic"},
]

[[case]]
name = "a fragment used through another fragment passes"
append = '''

.. source:: build/rtl/core/pair.v

   module pair (input wire a, output wire b);
       <<:core.outer>>
   endmodule

.. source:: :core.outer

   <<:core.pair-logic>>

.. source:: :core.pair-logic

   assign b = a;
'''
findings = []

[[case]]
name = "a cycle is a finding on each fragment in it"
append = '''

.. source:: build/rtl/core/pair.v

   module pair (input wire a, output wire b);
       <<:core.pair-logic>>
   endmodule

.. source:: :core.pair-logic

   <<:core.other>>

.. source:: :core.other

   <<:core.pair-logic>>
'''
findings = [
    {check = "fragment-cycles", at = ".. source:: :core.pair-logic"},
    {check = "fragment-cycles", at = ".. source:: :core.other"},
]

