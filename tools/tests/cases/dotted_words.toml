# doc.dotted-words

[[case]]
name = "a dotted word in a requirement is a finding on its line [Q8.4]"
only = "dotted-words"
findings = [
    {check = "dotted-words", anchor = "core.rotation", at = "the turn, Q8.4 to each thread."},
]

[[case.replace]]
old = '''
   The core shall give the turn after
   thread *t* to thread *t* + 1.
'''
new = '''
   The core shall give
   the turn, Q8.4 to each thread.
'''

