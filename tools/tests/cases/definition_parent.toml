# verifies: doc.definition-parent

[[case]]
name = "a definition with two parents is a finding on the option line"
findings = [
    {check = "definition-parent", anchor = "core.core", at = ":parent: core.timing, core.turn"},
]

[[case.replace]]
old = '''
.. definition:: core.core
   :parent: core.timing
'''
new = '''
.. definition:: core.core
   :parent: core.timing, core.turn
'''

[[case]]
name = "a requirement can have two parents"
findings = []

[[case.replace]]
old = '''
.. requirement:: core.rotation
   :parent: core.timing
'''
new = '''
.. requirement:: core.rotation
   :parent: core.timing, core.core
'''
